
openapi: 3.1.0

info:
  title: VixCommerce Orders API
  description: API responsável pela criação e consulta de pedidos.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Servidor local do Orders

paths:
  /:
    get:
      summary: Verificar funcionamento do Orders
      responses:
        "200":
          description: Serviço funcionando

  /orders:
    get:
      summary: Listar pedidos
      responses:
        "200":
          description: Lista de pedidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

    post:
      summary: Criar pedido
      description: >
        Cria um pedido, reserva os produtos no Inventory
        e registra o evento na Outbox.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Chave única para evitar pedidos duplicados.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrder"
      responses:
        "201":
          description: Pedido criado com sucesso
        "400":
          description: Pedido sem produtos
        "404":
          description: Produto não encontrado no Inventory
        "409":
          description: Chave de idempotência reutilizada com conteúdo diferente ou estoque insuficiente
        "503":
          description: Serviço Inventory indisponível

components:
  schemas:
    CreateOrder:
      type: object
      required:
        - customerId
        - items
      properties:
        customerId:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - sku
              - quantity
            properties:
              sku:
                type: string
              quantity:
                type: integer
                minimum: 1

    Order:
      type: object
      properties:
        id:
          type: string
        customer_id:
          type: string
        status:
          type: string
        created_at:
          type: string
          format: date-time
