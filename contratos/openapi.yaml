
openapi: 3.0.3

info:
  title: VixCommerce Inventory API
  description: API responsável pela consulta e reserva de estoque.
  version: 1.0.0

servers:
  - url: http://localhost:8001
    description: Servidor local do Inventory

paths:
  /:
    get:
      summary: Verificar funcionamento do Inventory
      responses:
        "200":
          description: Serviço funcionando

  /inventory/{sku}:
    get:
      summary: Consultar estoque de um produto
      parameters:
        - name: sku
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Estoque consultado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  sku:
                    type: string
                  available:
                    type: integer
        "404":
          description: Produto não encontrado

  /inventory/reservations:
    post:
      summary: Reservar estoque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sku
                - quantity
              properties:
                sku:
                  type: string
                quantity:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Estoque reservado com sucesso
        "400":
          description: Quantidade inválida
        "404":
          description: Produto não encontrado
        "409":
          description: Estoque insuficiente
