
services:
  rabbitmq:
    image: rabbitmq:4-management
    container_name: vixcommerce-rabbitmq
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: vixcommerce
      RABBITMQ_DEFAULT_PASS: vixcommerce123
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  rabbitmq_data:
